services:
  audiobind:
    image: ghcr.io/stinger303/audiobind:latest
    container_name: audiobind
    restart: unless-stopped
    environment:
      - PUID=99
      - PGID=100
      - TZ=America/Denver
      - LIBRARY_ROOT=/library
      - OUTPUT_ROOT=/output
      - AUTO_CONVERT=high          # high | medium | off
      - SCAN_INTERVAL_MIN=30
      - AUDIO_BITRATE=128k          # floor; richer sources keep their own bitrate
      - AUDIO_CHANNELS=1
      - JOBS=1
      - NICE=10
      - DRY_RUN=false
      # the names/IPs you browse to; anything else is refused (DNS-rebinding defence)
      - ALLOWED_HOSTS=localhost,127.0.0.1,tower,tower.local   # add your server's LAN IP
      # - AUTH_TOKEN=change-me      # optional sign-in for the UI; scripts send "Authorization: Bearer <token>"
      # - TRUSTED_PROXY=true        # only behind your own reverse proxy (trusts X-Forwarded-Host)
    # hardening: read-only root fs (the app writes only to the volumes below and /tmp),
    # no capabilities beyond the three the entrypoint needs to drop to PUID/PGID
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    volumes:
      # OWNER DECIDES: rw lets Delete remove source folders. The :ro line below is safer
      # (Audiobind can never touch your sources) but disables source-delete.
      - /mnt/user/data/media/audiobooks:/library:rw
      # - /mnt/user/data/media/audiobooks:/library:ro
      - /mnt/user/data/media/audiobooks-fixed:/output
      - /mnt/user/appdata/audiobind:/config
    ports:
      - "8080:8080"
    # ---- OPTIONAL: send every MyAnonamouse request through a VPN (see README, "Running MAM
    # through a VPN"). Option A, recommended: share the gluetun service's network. Then DELETE the
    # "ports:" block above (the port moves to gluetun below), and uncomment these two lines:
    # network_mode: "service:gluetun"
    # depends_on: [gluetun]
    # Option B: keep the ports above and use gluetun's HTTP proxy instead (fail-closed):
    #   add to environment:  - MAM_PROXY=http://gluetun:8888   (and HTTPPROXY=on on gluetun)
    # Either way you can arm the tripwire:  - MAM_HOME_WAN_IP=203.0.113.7
    # If qBittorrent shares gluetun's network too:  - QBIT_URL=http://127.0.0.1:8083
    healthcheck:
      test: ["CMD", "audiobind", "health"]
      interval: 60s
      timeout: 5s
      start_period: 180s

  # ---- OPTIONAL VPN container for the example above (uncomment the whole block) ----
  # gluetun:
  #   image: qmcgaw/gluetun
  #   container_name: gluetun
  #   restart: unless-stopped
  #   cap_add: [NET_ADMIN]
  #   devices:
  #     - /dev/net/tun:/dev/net/tun
  #   environment:
  #     - VPN_SERVICE_PROVIDER=mullvad          # 60+ providers, see the Gluetun wiki
  #     - VPN_TYPE=wireguard
  #     - WIREGUARD_PRIVATE_KEY=change-me
  #     - WIREGUARD_ADDRESSES=10.64.0.2/32
  #     # - HTTPPROXY=on                         # only for option B (MAM_PROXY)
  #   ports:
  #     - "8080:8080"                            # Audiobind's UI, published here for option A
