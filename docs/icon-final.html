<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#0b0d12;font:12px -apple-system,Segoe UI,Roboto,sans-serif;color:#8b93a7;padding:30px}
.row{display:flex;gap:26px;align-items:center;margin-bottom:26px}
figure{margin:0;text-align:center}
figcaption{margin-top:8px;font-size:10px;text-transform:uppercase;letter-spacing:.5px}
.big{width:180px;height:180px;border-radius:34px}
.mid{width:96px;height:96px;border-radius:18px}
.sm{width:48px;height:48px;border-radius:10px}
.xs{width:32px;height:32px;border-radius:7px}
</style></head><body>
<div class="row">
  <figure><svg class="big" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#0b1730"/><stop offset="58%" stop-color="#1e4fa0"/>
        <stop offset="100%" stop-color="#12a89b"/></linearGradient>
      <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#12a89b"/><stop offset="100%" stop-color="#0e8f85"/></linearGradient>
    </defs>
    <rect width="256" height="256" rx="56" fill="url(#bg)"/>
    <g transform="rotate(-7 128 128)">
      <rect x="64" y="42" width="136" height="172" rx="14" fill="#0a1326" opacity=".5" transform="translate(4 6)"/>
      <rect x="60" y="40" width="136" height="176" rx="14" fill="#f5f9ff"/>
      <rect x="60" y="40" width="26" height="176" rx="13" fill="url(#edge)"/>
      <rect x="60" y="40" width="13" height="176" fill="url(#edge)"/>
      <g fill="#1e4fa0">
        <rect x="100" y="104" width="17" height="52" rx="8.5"/>
        <rect x="125" y="80" width="17" height="100" rx="8.5"/>
        <rect x="150" y="94" width="17" height="72" rx="8.5"/>
        <rect x="175" y="114" width="17" height="32" rx="8.5"/>
      </g>
    </g>
  </svg><figcaption>180px</figcaption></figure>
  <figure><svg class="mid" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1730"/><stop offset="58%" stop-color="#1e4fa0"/>
      <stop offset="100%" stop-color="#12a89b"/></linearGradient>
      <linearGradient id="edge2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12a89b"/><stop offset="100%" stop-color="#0e8f85"/></linearGradient></defs>
    <rect width="256" height="256" rx="56" fill="url(#bg2)"/>
    <g transform="rotate(-7 128 128)">
      <rect x="60" y="40" width="136" height="176" rx="14" fill="#f5f9ff"/>
      <rect x="60" y="40" width="26" height="176" rx="13" fill="url(#edge2)"/>
      <g fill="#1e4fa0"><rect x="100" y="104" width="17" height="52" rx="8.5"/>
      <rect x="125" y="80" width="17" height="100" rx="8.5"/><rect x="150" y="94" width="17" height="72" rx="8.5"/>
      <rect x="175" y="114" width="17" height="32" rx="8.5"/></g>
    </g>
  </svg><figcaption>96px</figcaption></figure>
  <figure><svg class="sm" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1730"/><stop offset="58%" stop-color="#1e4fa0"/>
      <stop offset="100%" stop-color="#12a89b"/></linearGradient></defs>
    <rect width="256" height="256" rx="56" fill="url(#bg3)"/>
    <g transform="rotate(-7 128 128)">
      <rect x="60" y="40" width="136" height="176" rx="14" fill="#f5f9ff"/>
      <rect x="60" y="40" width="26" height="176" rx="13" fill="#12a89b"/>
      <g fill="#1e4fa0"><rect x="100" y="104" width="17" height="52" rx="8.5"/>
      <rect x="125" y="80" width="17" height="100" rx="8.5"/><rect x="150" y="94" width="17" height="72" rx="8.5"/>
      <rect x="175" y="114" width="17" height="32" rx="8.5"/></g>
    </g>
  </svg><figcaption>48px</figcaption></figure>
  <figure><svg class="xs" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1730"/><stop offset="58%" stop-color="#1e4fa0"/>
      <stop offset="100%" stop-color="#12a89b"/></linearGradient></defs>
    <rect width="256" height="256" rx="56" fill="url(#bg4)"/>
    <g transform="rotate(-7 128 128)">
      <rect x="60" y="40" width="136" height="176" rx="14" fill="#f5f9ff"/>
      <rect x="60" y="40" width="26" height="176" rx="13" fill="#12a89b"/>
      <g fill="#1e4fa0"><rect x="100" y="104" width="17" height="52" rx="8.5"/>
      <rect x="125" y="80" width="17" height="100" rx="8.5"/><rect x="150" y="94" width="17" height="72" rx="8.5"/>
      <rect x="175" y="114" width="17" height="32" rx="8.5"/></g>
    </g>
  </svg><figcaption>32px</figcaption></figure>
</div>
</body></html>
