<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#0b0d12;font:13px -apple-system,Segoe UI,Roboto,sans-serif;color:#8b93a7;
     display:flex;gap:30px;padding:32px;align-items:flex-start;flex-wrap:wrap}
figure{margin:0;text-align:center}
figcaption{margin-top:9px;letter-spacing:.5px;text-transform:uppercase;font-size:11px}
svg.big{width:170px;height:170px;display:block;border-radius:32px;box-shadow:0 12px 30px rgba(0,0,0,.55)}
svg.sm{width:40px;height:40px;border-radius:9px;margin-top:8px}
</style></head><body>

<!-- 5. COVER + CUT WAVE -->

    <rect x="62" y="46" width="132" height="164" rx="12" fill="#0a1326" opacity=".55"/>
    <rect x="58" y="42" width="132" height="164" rx="12" fill="#f4f8ff"/>
